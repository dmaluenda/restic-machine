# restic-machine configuration (all settings are optional).
#
# Copy it to ~/.config/restic-machine/config.toml, or point RESTIC_MACHINE_CONFIG at it.
# Without a config file restic-machine uses restic's own environment variables
# (RESTIC_REPOSITORY, RESTIC_PASSWORD_FILE, ...).
#
# restic-machine never stores your password: give restic a password file or a command.

[restic]
# binary = "/usr/local/bin/restic"             # default: `restic` from PATH
# repository = "sftp:backup@nas:/srv/restic"   # -> RESTIC_REPOSITORY
# repository_file = "~/.config/restic/repo"    # -> RESTIC_REPOSITORY_FILE
# password_file = "~/.config/restic/password"  # -> RESTIC_PASSWORD_FILE
# password_command = "pass show restic"        # -> RESTIC_PASSWORD_COMMAND

# Any other variable restic understands, e.g. backend settings.
# [restic.env]
# AWS_PROFILE = "backup"

[index]
# Where the index lives (one SQLite file per repository). It lists every file name in
# your backups: keep it private, and outside the paths you back up if you can.
# data_dir = "~/.cache/restic-machine"

# Snapshots removed by `restic forget` disappear from the timeline at once, but stay in
# the index this many days, in case you want to look into what happened.
# forgotten_retention_days = 30

# The retention policy: which snapshots to keep. The Retention page shows and simulates
# it; `restic-machine forget` applies it (run it from your backup job). Each rule is
# restic's `--keep-<rule>`; leave out the ones you don't use.
# [retention]
# keep_last = 10
# keep_hourly = 24
# keep_daily = 7
# keep_weekly = 8
# keep_monthly = 24
# keep_yearly = 10
# keep_within = "14d"          # also keep_within_hourly, _daily, _weekly, _monthly, _yearly
# keep_tag = ["keep"]
# group_by = "host,paths"
# prune = true                 # free the space after forgetting (default)

[repository]
# What you call this repository; the page shows it next to the repository's id.
# name = "Laptop"

[browse]
# Where Browse opens (the folders down to it open, and the side panel shows it). As restic
# names it: /C/Users/me/Documents (C:\Users\me\Documents is accepted too). Default: /
# initial_path = "/home/me/projects"

[backup]
# What `restic-machine backup` (run by the schedule) backs up.
# sources = ["C:/Users/me"]
# The exclude file it gives restic (--exclude-file). Browse adds the paths you exclude to it.
# excludes_file = "~/.config/restic/excludes.txt"
# use_fs_snapshot = true      # Windows: VSS snapshot, for files in use (needs the task's admin rights)

# If the repository is on a Windows share with a login of its own.
# [backup.share]
# path = "\\\\nas\\backups"
# user = "backup"
# password_file = "~/.config/restic/share-password"
# by_ip = true                # Windows allows one login per server name

# When. The run at prune_at also applies the retention policy (forget + prune).
# [backup.schedule]
# every_hours = 1
# from = "08:00"
# to = "23:00"
# also_at = ["04:00"]
# prune_at = "04:00"
